name: Deploy to Cloudflare Workers

# Manual deploy. Run it from the GitHub "Actions" tab → "Deploy to Cloudflare
# Workers" → "Run workflow" once you have set up your Cloudflare resources.
#
# Before the first deploy:
#   1. Create a D1 database + R2 bucket in Cloudflare and put the real
#      `database_id` / bucket name into apps/user-application/wrangler.jsonc.
#   2. Set the worker secret:  wrangler secret put BETTER_AUTH_SECRET
#   3. Add repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#   4. Apply remote migrations:  pnpm db:migrate:remote
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Deploy user-application
        run: pnpm run deploy:user-application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
