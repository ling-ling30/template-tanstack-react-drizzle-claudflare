<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fafafa; color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fafafa; }
        .card { background: #171717 !important; border-color: #262626 !important; }
      }
      .card {
        max-width: 360px; margin: 24px; padding: 28px; text-align: center;
        background: #fff; border: 1px solid #e5e5e5; border-radius: 12px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #737373; margin: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This page isn't available without a connection. Reconnect and try again.</p>
    </div>
  </body>
</html>
